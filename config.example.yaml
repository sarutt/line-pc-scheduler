# ===== ตั้งค่า LINE PC Scheduler =====
# คัดลอกไฟล์นี้เป็น config.yaml แล้วแก้ค่าให้ตรงกับเครื่องคุณ
#   copy: config.example.yaml  ->  config.yaml

timezone: "Asia/Bangkok"

line:
  # ชื่อหน้าต่างหลักของ LINE (ปกติคือ "LINE") — ใช้ค้นหาหน้าต่าง
  window_title: "LINE"
  # class หน้าต่างหลัก (แยกจากหน้าต่างซ่อนที่ชื่อ LINE เหมือนกัน) — อย่าแก้ถ้าไม่จำเป็น
  window_class: "AllInOneWindow"
  # class หน้าต่างห้องแชตที่ "เด้งออกมา" เมื่อ double-click แถวกลุ่ม
  chat_window_class: "ChatWindow"

  # ชื่อห้อง/กลุ่มเป้าหมายเดี่ยว (ใช้เมื่อไม่ได้กำหนด targets ด้านล่าง) — ยืนยันก่อนส่ง กันส่งผิดห้อง
  target_name: ""

  # กลุ่มเป้าหมายหลายกลุ่ม — ปักหมุดไว้บนสุดเรียงกัน แล้วระบุ ชื่อ + พิกัดแถว [x, y]
  # (ถ้ากำหนด targets จะใช้อันนี้แทน target_name/coords.chat_row)
  targets:
    - name: "กลุ่ม A"
      chat_row: [240, 140]   # แถวบนสุด
    - name: "กลุ่ม B"
      chat_row: [240, 215]   # แถวถัดลงมา
    # - name: "กลุ่ม C"
    #   chat_row: [240, 290]

  # พาธไฟล์ LINE.exe เผื่อสคริปต์ต้องเปิด LINE ให้เอง (ถ้า LINE เปิดอยู่แล้วจะไม่ใช้)
  exe_path: "C:\\Users\\%USERNAME%\\AppData\\Local\\LINE\\bin\\LineLauncher.exe"

  # ขนาด/ตำแหน่งหน้าต่างหลักที่จะบังคับก่อนส่งทุกครั้ง (พิกเซล)
  window:
    x: 0
    y: 0
    width: 480
    height: 900

  # พิกัดคลิก (อ้างอิงจากมุมซ้ายบนของหน้าต่างหลัก) — ได้จาก calibrate.py
  # chat_row = แถวกลุ่มที่ "ปักหมุดไว้บนสุด" (ระบบ double-click แถวนี้เพื่อเปิดห้อง)
  #   หมายเหตุ: message_box ไม่ใช้แล้ว (เดี๋ยวนี้พิมพ์ในหน้าต่างห้องแชตที่เด้งออกมา)
  coords:
    chat_row: [240, 140]
    message_box: [240, 850]   # (คงไว้เพื่อความเข้ากันได้ ไม่ถูกใช้)

  # ตำแหน่งช่องพิมพ์ "ในหน้าต่างห้องแชต": [ระยะจากซ้าย, ระยะจากล่าง] พิกเซล
  chat_input: [90, 95]

  # ปิดหน้าต่างห้องแชตอัตโนมัติหลังส่งเสร็จหรือไม่
  close_chat_after: false

  # หน่วงเวลา (วินาที) — เครื่องช้าให้เพิ่มค่า
  delays:
    after_launch: 6.0     # รอ LINE เปิด (ครั้งแรก)
    after_focus: 1.0      # รอหลังโฟกัส/ย้ายหน้าต่าง
    after_open_chat: 1.2  # รอหลัง double-click เปิดห้อง
    after_click_box: 0.5  # รอหลังคลิกช่องพิมพ์
    after_paste: 0.4      # รอหลังพิมพ์ข้อความ ก่อนกดส่ง

# ตารางข้อความที่จะส่งอัตโนมัติ
# time = HH:MM (24 ชม.), days = mon,tue,wed,thu,fri,sat,sun หรือช่วง mon-fri หรือ * (ทุกวัน)
# แต่ละรายการมี text และ/หรือ image (พาธไฟล์รูป — ใส่หลายรูปเป็น list ได้)
# order = ลำดับส่งเมื่อมีทั้งข้อความและรูป: image_first (รูปก่อน, ค่าเริ่มต้น) | text_first (ข้อความก่อน)
# targets = ส่งเข้ากลุ่มไหนบ้าง (list ของชื่อกลุ่ม จาก line.targets) — ไม่ใส่ = ส่งทุกกลุ่ม
messages:
  - time: "09:00"
    days: "mon-fri"
    text: "สวัสดีตอนเช้าครับ ☀️"     # ไม่ใส่ targets = ส่งทุกกลุ่ม

  - time: "18:00"
    days: "*"
    targets: ["กลุ่ม A"]            # ส่งเฉพาะกลุ่ม A
    text: |
      สรุปประจำวัน
      - รายการที่ 1
      - รายการที่ 2

  # ตัวอย่างส่งหลายรูป + ข้อความ โดยส่งข้อความก่อนแล้วค่อยส่งรูป
  - time: "12:00"
    days: "*"
    order: "text_first"
    text: "รูปประจำวัน"
    image:
      - "C:\\path\\to\\pic1.png"
      - "C:\\path\\to\\pic2.png"
